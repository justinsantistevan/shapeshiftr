schema-version = "1.12.0"
# Generated by /floxify

[install]
# Project requires Node >=18 (README); Node 22 is the chosen development line.
# package.json has no exact runtime pin. Node includes npm.
nodejs.pkg-path = "nodejs_22"
# deno.json and supabase/functions use Deno; no runtime version is pinned.
deno.pkg-path = "deno"

[hook]
on-activate = '''
  cd "$FLOX_ENV_PROJECT" || return 1
  mkdir -p "$FLOX_ENV_CACHE" || return 1
  # Include the runtime and platform so native npm packages refresh when needed.
  deps_key="$(node --input-type=module -e '
    import { createHash } from "node:crypto";
    import { readFileSync } from "node:fs";
    const hash = createHash("sha256");
    for (const file of ["package.json", "package-lock.json"]) {
      hash.update(readFileSync(file));
    }
    hash.update(process.version + process.platform + process.arch);
    console.log(hash.digest("hex"));
  ')" || return 1
  stamp="$FLOX_ENV_CACHE/npm-deps.sha256"
  previous_key="$(cat "$stamp" 2>/dev/null || true)"
  if [ ! -d node_modules ] || [ "$deps_key" != "$previous_key" ]; then
    npm ci --no-fund --no-audit >&2 || return 1
    printf '%s\n' "$deps_key" > "$stamp" || return 1
  fi
'''
